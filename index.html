<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0620" />
    <meta name="format-detection" content="telephone=no" />
    <title>ابومیرزا - بازی کلمات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      html {
        height: 100%;
        height: -webkit-fill-available;
        overflow: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        height: -webkit-fill-available;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif;
        background: #0d0620;
        color: #fff;
        touch-action: manipulation;
        /* Prevent Android WebView text size adjustment */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
